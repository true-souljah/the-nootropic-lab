name: build

# Runs on every push and pull request. Builds all 8 region apps in parallel
# using the same `npm ci` flow Cloudflare Pages uses, so any CI-only
# breakage (production install, missing build deps, etc.) surfaces here
# before it reaches the deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: packages/ui typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit -p packages/ui/tsconfig.json

  validate-data:
    name: product data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate-data

  content-dates:
    name: content-dates.json is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the map is derived from full commit history
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node scripts/content-dates.mjs
      - name: Fail when the committed map is stale
        run: |
          if ! git diff --exit-code -- packages/data/src/content-dates.json; then
            echo '::error::packages/data/src/content-dates.json is stale — run `npm run content-dates` and commit.'
            exit 1
          fi

  # Secret gate: a hardcoded DeepL key sat in scripts/ for months (#283).
  # Scans every commit with gitleaks' default rules; the two rotated findings
  # from 90fbb10 are fingerprinted in .gitleaksignore. --redact keeps matched
  # values out of the public Actions log.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # A PR must not be able to exempt its own leak: on PRs .gitleaksignore
      # and .gitleaks.toml come from the base branch (removed if the base has
      # none), and inline gitleaks:allow comments are ignored.
      - name: Use the base branch's gitleaks allowlist
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify -q "origin/$BASE_REF^{commit}" >/dev/null \
            || { echo "::error::origin/$BASE_REF is not in the checkout"; exit 1; }
          for f in .gitleaksignore .gitleaks.toml; do
            rm -f "$f" # also drops a PR-supplied symlink before writing
            if git cat-file -e "origin/$BASE_REF:$f" 2>/dev/null; then
              git show "origin/$BASE_REF:$f" > "$f"
            fi
          done
      - name: Scan full history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --ignore-gitleaks-allow .

  test:
    name: packages/ui unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  e2e:
    name: Playwright multi-region smoke (${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    # The test phase (8 regions x 3 browsers, workers:1 in CI) is ~19 min when
    # run serially — sharding splits the same suite across parallel jobs with
    # no coverage change. workers:1 stays as-is per shard (stability choice in
    # playwright.config.ts); raise the shard count before touching workers.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      # playwright.config.ts runs 8 webServer entries
      # (JP/LATAM/CA/EU/US/AU/GCC/SEA on ports 4173–4180) and times out at
      # 60s if any out/ is missing. PR-Q40 closed the 8-of-8-regions
      # infrastructure milestone. The 8 region builds are reused from the
      # `build` matrix job's artifacts (prod `npm ci --omit=dev` builds — the
      # same bits Cloudflare deploys) instead of rebuilding all 8 sequentially
      # here, which was this workflow's ~20-minute bottleneck.
      - uses: actions/download-artifact@v8
        with:
          pattern: out-*
          path: _out
      - name: Place region builds
        run: |
          for r in us eu ca au jp latam gcc sea; do
            mkdir -p "apps/$r/out"
            cp -R "_out/out-$r/." "apps/$r/out/"
          done
      # Dead-link gate over all 8 builds: every hreflang alternate and internal
      # anchor must resolve in the target region's out/ (GSC 404 class guard).
      - run: npm run check:links
      # Title gate over all 8 builds: one non-empty <title> per page and the
      # brand never repeated (page title + layout template suffix).
      - run: npm run check:titles
      # Consent gate over all 8 builds: no pre-consent tracker fetch
      # (script src / preload), Klaro mount + "Cookie settings" control on
      # every page.
      - run: npm run check:consent
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [us, eu, ca, au, jp, latam, gcc, sea]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # Mirror Cloudflare's prod install so CI fails the same way prod does.
      # If you drop a build-time dep into devDependencies, this catches it here.
      - run: npm ci --omit=dev
        env:
          NODE_ENV: production

      - run: npm run build:${{ matrix.app }}
        env:
          NODE_ENV: production

      # Share the built site with the e2e job, which previously rebuilt all 8
      # regions sequentially — this workflow's ~20-minute bottleneck.
      - uses: actions/upload-artifact@v7
        with:
          name: out-${{ matrix.app }}
          path: apps/${{ matrix.app }}/out
          retention-days: 1
