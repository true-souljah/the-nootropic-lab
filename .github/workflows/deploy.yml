name: deploy

# Deploys the 8 region apps to their Cloudflare Pages projects from GitHub
# Actions (wrangler Direct Upload into the existing git-connected projects).
# Cloudflare's own git builds share one build slot across the whole account:
# on 2026-10-12 a main merge waited 30+ minutes in that queue and was skipped
# whenever a newer merge landed first, so #366–#371 never deployed on their
# own. These builds run in parallel on GitHub runners and never enter it.
#
# Requires: repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages >
# Edit) and CLOUDFLARE_ACCOUNT_ID, and "automatic production branch
# deployments" turned OFF on the 8 Pages projects. Cloudflare documents that a
# git-connected project with automatic deployments disabled takes wrangler
# deploys; left on, Cloudflare keeps building main too and an older build can
# finish after a newer deploy.
# Rollback: turn automatic production deployments back on and delete this file.

on:
  push:
    branches: [main]
  # PRs run only the plan job (region map guard + workflow validation).
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: 'Deploy a single region (empty = all 8)'
        required: false
        default: ''

# At most one run per ref. A running deploy is never cancelled; a newer push
# replaces only a run that is still pending, so the newest commit always ships
# and no deploy stops half-way.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan region matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Region -> Cloudflare Pages project (the US project really is named
      # "thnootropiclab-us"). Fails closed when an apps/<region> directory has
      # no entry here, which would leave a new region undeployed, or an entry
      # has no app.
      - id: plan
        env:
          ONLY: ${{ github.event.inputs.region }}
        run: |
          cat > "$RUNNER_TEMP/regions.json" <<'JSON'
          [
            {"region": "us",    "project": "thnootropiclab-us"},
            {"region": "eu",    "project": "thenootropiclab-eu"},
            {"region": "ca",    "project": "nootropic-ca"},
            {"region": "au",    "project": "nootropic-au"},
            {"region": "jp",    "project": "nootropic-jp"},
            {"region": "latam", "project": "nootropic-latam"},
            {"region": "gcc",   "project": "nootropic-gcc"},
            {"region": "sea",   "project": "nootropic-sea"}
          ]
          JSON
          mapped=$(jq -r '.[].region' "$RUNNER_TEMP/regions.json" | sort | tr '\n' ' ')
          apps=$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' ')
          if [ "$mapped" != "$apps" ]; then
            echo "::error::deploy.yml maps [ $mapped] but apps/ has [ $apps] — add or remove the region's Pages project here"
            exit 1
          fi
          if [ -n "$ONLY" ]; then
            jq -c --arg r "$ONLY" '[.[] | select(.region == $r)]' "$RUNNER_TEMP/regions.json" > "$RUNNER_TEMP/matrix.json"
          else
            jq -c '.' "$RUNNER_TEMP/regions.json" > "$RUNNER_TEMP/matrix.json"
          fi
          [ "$(jq 'length' "$RUNNER_TEMP/matrix.json")" -gt 0 ] || { echo "::error::region '$ONLY' matched nothing"; exit 1; }
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy ${{ matrix.region }}
    needs: plan
    # Production deploys only from main (push, or a manual run on main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Fail closed without Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::repo secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::repo secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # The same production install and build as build.yml's `build` job,
      # whose artifacts the Playwright suite and the link/title/consent/
      # disclosure gates check.
      - run: npm ci --omit=dev
        env:
          NODE_ENV: production
      - run: npm run build:${{ matrix.region }}
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.region }}/out --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ github.sha }}
